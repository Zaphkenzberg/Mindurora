# AURORA release: push a tag like v1.0 -> GitHub builds the desktop jar and the Android APK and attaches both to the release.
# (Replaces Anuke's deployment, which pushed to his own repositories with his tokens.)
# AURORA реліз: пуш тегу на кшталт v1.0 -> GitHub збирає jar для ПК і APK для Android та прикріплює обидва до релізу.
# (Замінює деплой Anuke, який пушив у його власні репозиторії з його токенами.)
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the release and upload files — створити реліз і завантажити файли

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # No separate Android setup: GitHub's Ubuntu runner already has the Android SDK (ANDROID_HOME) with licenses accepted.
    # (android-actions/setup-android@v3 fails: it asks for the long-removed 'tools' package.)
    # — Окремого встановлення Android нема: на Ubuntu-раннері GitHub Android SDK уже є (ANDROID_HOME) з прийнятими ліцензіями.
    # (android-actions/setup-android@v3 падає: просить давно прибраний пакет 'tools'.)

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    # Arc (Anuke's engine) at the exact commit from gradle.properties, next to the repo: the build then compiles it
    # from source (settings.gradle includeBuild '../Arc'). JitPack has no build of this commit.
    # — Arc (рушій Anuke) на точному коміті з gradle.properties, поруч із репо: збірка компілює його з коду
    # (settings.gradle includeBuild '../Arc'). На JitPack збірки цього коміту нема.
    - name: Get Arc
      run: |
        ARC_HASH=$(grep '^archash=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
        echo "Arc commit: $ARC_HASH"
        git clone https://github.com/Anuken/Arc ../Arc
        git -C ../Arc checkout "$ARC_HASH"

    # 152 = the Mindustry build AURORA is based on: keeps multiplayer compatibility with v152
    # — 152 = збірка Mindustry, на якій стоїть AURORA: зберігає мережеву сумісність з v152
    # Separate Gradle runs: in one run R8 did not find android's merged_java_res/debug/base.jar.
    # — Окремі запуски Gradle: в одному запуску R8 не знаходив android merged_java_res/debug/base.jar.
    - name: Build jar
      run: |
        chmod +x gradlew
        ./gradlew desktop:dist -Pbuildversion=152 --stacktrace

    # Release APK signed with our own key (GitHub secrets), so every release installs over the previous one.
    # android/build.gradle reads ../../bekeystore.jks (next to the repo folder) and keystore_* env when CI=true.
    # — Release APK, підписаний нашим ключем (секрети GitHub), щоб кожен реліз ставився поверх попереднього.
    # android/build.gradle читає ../../bekeystore.jks (поруч із папкою репо) і змінні keystore_*, коли CI=true.
    - name: Get the signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::secret KEYSTORE_BASE64 is missing"; exit 1; fi
        echo "$KEYSTORE_BASE64" | base64 -d > ../bekeystore.jks

    - name: Build APK
      env:
        keystore_password: ${{ secrets.KEYSTORE_PASSWORD }}
        keystore_alias: ${{ secrets.KEY_ALIAS }}
        keystore_alias_password: ${{ secrets.KEY_PASSWORD }}
      run: |
        ./gradlew android:assembleRelease -Pbuildversion=152 --no-build-cache --stacktrace || {
          echo "::group::merged_java_res"; find android/build/intermediates/merged_java_res -maxdepth 3 -ls; echo "::endgroup::"
          exit 1
        }

    - name: Remove the signing key
      if: always()
      run: rm -f ../bekeystore.jks

    - name: Collect files
      run: |
        mkdir out
        cp desktop/build/libs/*.jar "out/AURORA-${GITHUB_REF_NAME}.jar"
        # android-release.apk = signed; android-release-unsigned.apk would mean the key was not used
        # — android-release.apk = підписаний; android-release-unsigned.apk означав би, що ключ не спрацював
        cp android/build/outputs/apk/release/android-release.apk "out/AURORA-${GITHUB_REF_NAME}.apk"
        ls -la out

    - name: Upload to the release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: out/*

    # Manual run (no tag): keep the files as a downloadable build artifact
    # — Ручний запуск (без тегу): файли лишаються як артефакт збірки для скачування
    - name: Upload as artifact
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: AURORA-build
        path: out/*
